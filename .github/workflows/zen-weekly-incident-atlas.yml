name: ZEN Weekly Incident Atlas — TypeScript and build verification
on:
  pull_request:
    paths:
      - "app/zen-weekly/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:
jobs:
  validate-incident-atlas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck atlas and reader
        run: npx tsc --noEmit -p tsconfig.vercel.json
      - name: Build Next/Vinext site
        run: npm run build
